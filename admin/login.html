<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
    <title>Admin Giriş | MAde3D</title>
    <link rel="stylesheet" href="../css/global.css">
  </head>
  <body class="admin-body" data-admin-page="login">
    <main class="auth-shell">
      <section class="auth-panel">
        <form class="form-card" id="loginForm">
          <div>
            <span class="badge">MAde3D Admin</span>
            <h1>Giriş yap</h1>
          </div>
          <div class="field">
            <label for="email">E-posta</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="password">Şifre</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="muted" id="loginError" role="alert"></p>
          <button class="btn btn-primary" type="submit">Giriş yap</button>
          <a class="btn btn-outline" href="../index.html">Siteye dön</a>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../admin-js/auth.js"></script>
  </body>
</html>
